# Developer tool requirements:
#   cargo install cargo-make --locked
#   rustup component add rustfmt clippy
#   cargo install cargo-nextest cargo-llvm-cov cargo-audit cargo-deny zizmor cargo-xwin --locked
#   rustup component add llvm-tools-preview
#   go install github.com/rhysd/actionlint/cmd/actionlint@v1.7.12 (or use a release binary)
#   shellcheck from the host platform package manager or official release archive
#   git from the host platform
# Lizard is pinned to the version used by Codacy:
#   uv tool install lizard==1.23.0
#
# cargo-msrv is needed only when discovering or updating the MSRV:
#   cargo install cargo-msrv --locked
# Routine verification uses the pinned toolchain directly:
#   rustup toolchain install 1.85.0 --profile minimal

[env]
MSRV_VERSION = "1.85.0"
COMPLEXITY_LIZARD_VERSION = { value = "1.23.0", condition = { env_not_set = ["COMPLEXITY_LIZARD_VERSION"] } }
COMPLEXITY_MAX_CCN = { value = "10", condition = { env_not_set = ["COMPLEXITY_MAX_CCN"] } }
COMPLEXITY_MAX_FUNCTION_NLOC = { value = "50", condition = { env_not_set = ["COMPLEXITY_MAX_FUNCTION_NLOC"] } }
COMPLEXITY_MAX_PARAMETERS = { value = "8", condition = { env_not_set = ["COMPLEXITY_MAX_PARAMETERS"] } }
COMPLEXITY_MAX_FILE_NLOC = { value = "500", condition = { env_not_set = ["COMPLEXITY_MAX_FILE_NLOC"] } }

# Coverage

[tasks.prepare-coverage]
description = "Create the LLVM coverage output directory"
script_runner = "@duckscript"
script = ["mkdir target/llvm-cov"]

[tasks.test]
description = "Run native tests and write repository-relative LCOV coverage"
dependencies = ["prepare-coverage"]
command = "cargo"
args = [
  "llvm-cov",
  "nextest",
  "--all-targets",
  "--all-features",
  "--locked",
  "--no-fail-fast",
  "--remap-path-prefix",
  "--lcov",
  "--output-path=target/llvm-cov/coverage.lcov",
]

[tasks.test-html]
description = "Run native tests and generate a local HTML coverage report"
command = "cargo"
args = [
  "llvm-cov",
  "nextest",
  "--all-targets",
  "--all-features",
  "--locked",
  "--no-fail-fast",
  "--remap-path-prefix",
  "--html",
]

# Source quality

[tasks.format]
description = "Check Rust formatting without modifying files"
command = "cargo"
args = ["fmt", "--all", "--", "--check"]

[tasks.whitespace]
description = "Check unstaged and staged changes for whitespace errors"
script_runner = "@duckscript"
script = [
  "exec --fail-on-error git diff --check",
  "exec --fail-on-error git diff --cached --check",
]

[tasks.quality]
description = "Detect maintainability and quality drift with strict Clippy checks"
command = "cargo"
args = [
  "clippy",
  "--all-targets",
  "--all-features",
  "--locked",
  "--",
  "-D",
  "warnings",
  "-W",
  "clippy::too_many_lines",
  "-W",
  "clippy::too_many_arguments",
  "-W",
  "clippy::cognitive_complexity",
  "-W",
  "clippy::large_stack_arrays",
  "-W",
  "clippy::large_types_passed_by_value",
]

[tasks.complexity]
description = "Report Codacy-aligned Rust complexity findings without failing verification"
script_runner = "python"
script_extension = "py"
script = '''
import csv
import io
import os
from pathlib import Path
import re
import subprocess
import sys
import xml.etree.ElementTree as ET


class CheckerError(Exception):
    pass


def limit(name):
    value = os.environ.get(name, "")
    if not re.fullmatch(r"[1-9][0-9]*", value):
        raise CheckerError(f"{name} must be a positive integer, got {value!r}")
    return int(value)


def run(command):
    try:
        result = subprocess.run(command, capture_output=True, text=True, check=False)
    except FileNotFoundError as error:
        raise CheckerError(f"required executable not found: {command[0]}") from error
    if result.returncode != 0:
        detail = result.stderr.strip() or result.stdout.strip() or "no diagnostic output"
        raise CheckerError(f"{' '.join(command[:2])} failed with exit code {result.returncode}: {detail}")
    return result.stdout


def normalized(path):
    return Path(path.removeprefix("./")).as_posix()


def integer(row, field):
    try:
        value = int(row[field])
    except (KeyError, TypeError, ValueError) as error:
        raise CheckerError(f"invalid CSV {field} value: {row.get(field)!r}") from error
    if value < 0:
        raise CheckerError(f"invalid CSV {field} value: {value}")
    return value


def rust_files():
    output = run(["git", "ls-files", "-z", "--cached", "--others", "--exclude-standard", "--", "*.rs"])
    files = sorted(normalized(path) for path in output.split("\0") if path)
    if not files:
        raise CheckerError("no non-ignored Rust source files found")
    return files


def function_metrics(output, files):
    reader = csv.DictReader(io.StringIO(output))
    required = {"NLOC", "CCN", "PARAM", "file", "function", "start"}
    if reader.fieldnames is None or not required.issubset(reader.fieldnames):
        raise CheckerError(f"unexpected CSV columns: {reader.fieldnames!r}")

    rows = []
    for row in reader:
        path = normalized(row["file"])
        if path not in files or not row["function"]:
            raise CheckerError(f"unexpected CSV function record: {row!r}")
        start = integer(row, "start")
        if start == 0:
            raise CheckerError(f"invalid CSV start value: {start}")
        rows.append(
            {
                "file": path,
                "function": row["function"],
                "line": start,
                "nloc": integer(row, "NLOC"),
                "ccn": integer(row, "CCN"),
                "parameters": integer(row, "PARAM"),
            }
        )
    return rows


def file_metrics(output, expected_files):
    try:
        root = ET.fromstring(output)
    except ET.ParseError as error:
        raise CheckerError(f"invalid Lizard XML: {error}") from error

    measures = root.findall(".//measure[@type='File']")
    if len(measures) != 1:
        raise CheckerError(f"expected one XML File measure, found {len(measures)}")
    measure = measures[0]
    labels = [label.text for label in measure.findall("./labels/label")]
    if "NCSS" not in labels:
        raise CheckerError(f"XML File measure lacks NCSS: {labels!r}")
    nloc_index = labels.index("NCSS")

    metrics = {}
    for item in measure.findall("./item"):
        path = normalized(item.get("name", ""))
        values = [value.text for value in item.findall("./value")]
        if not path or len(values) != len(labels) or path in metrics:
            raise CheckerError(f"unexpected XML file record for {path!r}")
        try:
            nloc = int(values[nloc_index])
        except (TypeError, ValueError) as error:
            raise CheckerError(f"invalid XML NCSS value for {path!r}: {values[nloc_index]!r}") from error
        if nloc < 0:
            raise CheckerError(f"invalid XML NCSS value for {path!r}: {nloc}")
        metrics[path] = nloc

    actual_files = set(metrics)
    expected_files = set(expected_files)
    if actual_files != expected_files:
        missing = sorted(expected_files - actual_files)
        unexpected = sorted(actual_files - expected_files)
        raise CheckerError(f"Rust analysis file mismatch; missing={missing!r}, unexpected={unexpected!r}")
    return metrics


def collect_findings(functions, file_nloc, thresholds):
    findings = []
    for function in functions:
        for metric, value in (
            ("CCN", function["ccn"]),
            ("function NLOC", function["nloc"]),
            ("parameters", function["parameters"]),
        ):
            configured = thresholds[metric]
            if value > configured:
                message = (
                    f"{function['file']}:{function['line']}: function {function['function']!r}: "
                    f"{metric} actual={value} limit={configured}"
                )
                findings.append((function["file"], function["line"], metric, message))
    for path, value in file_nloc.items():
        configured = thresholds["file NLOC"]
        if value > configured:
            message = f"{path}: file NLOC actual={value} limit={configured}"
            findings.append((path, 0, "file NLOC", message))
    return sorted(findings)


def report(version, thresholds, findings):
    print(f"Lizard version: {version}")
    print(
        "Effective thresholds: "
        f"CCN <= {thresholds['CCN']}; "
        f"function NLOC <= {thresholds['function NLOC']}; "
        f"parameters <= {thresholds['parameters']}; "
        f"file NLOC <= {thresholds['file NLOC']}"
    )
    for _, _, _, message in findings:
        print(message)
    if findings:
        print(f"Complexity: {len(findings)} advisory finding(s); findings do not fail verification.")
    else:
        print("Complexity: no advisory findings.")


def main():
    expected_version = os.environ.get("COMPLEXITY_LIZARD_VERSION", "")
    if not expected_version:
        raise CheckerError("COMPLEXITY_LIZARD_VERSION must not be empty")
    thresholds = {
        "CCN": limit("COMPLEXITY_MAX_CCN"),
        "function NLOC": limit("COMPLEXITY_MAX_FUNCTION_NLOC"),
        "parameters": limit("COMPLEXITY_MAX_PARAMETERS"),
        "file NLOC": limit("COMPLEXITY_MAX_FILE_NLOC"),
    }

    actual_version = run(["lizard", "--version"]).strip()
    if actual_version != expected_version:
        raise CheckerError(f"Lizard version mismatch: expected {expected_version}, got {actual_version!r}")

    files = rust_files()
    common = ["lizard", "-l", "rust", "-i", "-1", *files]
    functions = function_metrics(run(common[:3] + ["-V", "--csv"] + common[3:]), set(files))
    file_nloc = file_metrics(run(common[:3] + ["--xml"] + common[3:]), files)
    report(actual_version, thresholds, collect_findings(functions, file_nloc, thresholds))


try:
    main()
except CheckerError as error:
    print(f"error: complexity checker: {error}", file=sys.stderr)
    sys.exit(1)
'''

[tasks.doc]
description = "Build Rust documentation with warnings denied"
env = { "RUSTDOCFLAGS" = "-D warnings" }
command = "cargo"
args = ["doc", "--no-deps", "--locked"]

# Dependency and workflow policy

[tasks.audit]
description = "Check dependencies against RustSec advisories"
command = "cargo"
args = ["audit"]

[tasks.deny]
description = "Check dependency advisories, licences, bans, and sources"
command = "cargo"
args = ["deny", "--locked", "check"]

[tasks.shellcheck-present]
private = true
command = "shellcheck"
args = ["--version"]

[tasks.actions-lint]
description = "Validate GitHub Actions syntax and embedded shell with ShellCheck"
dependencies = ["shellcheck-present"]
command = "actionlint"

[tasks.installers-shellcheck]
description = "Check the Unix installer and its test script with ShellCheck"
dependencies = ["shellcheck-present"]
command = "shellcheck"
args = ["install.sh", "tests/installers/unix.sh"]

[tasks.zizmor]
description = "Audit GitHub Actions workflows with the pedantic persona"
command = "zizmor"
args = ["--persona=pedantic", "."]

# Packaging

[tasks.package]
description = "Verify the crate package using the lockfile"
command = "cargo"
args = ["package", "--locked"]

[tasks._package-working-tree]
private = true
description = "Verify the current working tree as a crate package"
command = "cargo"
args = ["package", "--locked", "--allow-dirty"]

[tasks.package-list]
description = "List files included in the crate package"
command = "cargo"
args = ["package", "--list", "--locked"]

# Minimum supported Rust version

[tasks.msrv-check]
private = true
install_crate = false
command = "cargo"
args = [
  "+${MSRV_VERSION}",
  "check",
  "--all-targets",
  "--all-features",
  "--locked",
]

[tasks.msrv-test]
private = true
dependencies = ["msrv-check"]
install_crate = false
command = "cargo"
args = [
  "+${MSRV_VERSION}",
  "test",
  "--all-targets",
  "--all-features",
  "--locked",
]

[tasks.msrv]
description = "Compile and test using the minimum supported Rust version"
dependencies = ["msrv-test"]

# Host guards

[tasks._require-host]
private = true
script_runner = "@duckscript"
script = '''
host_is_valid = set false
if equals ${REQUIRED_HOST} unix
    if not equals ${CARGO_MAKE_RUST_TARGET_OS} windows
        host_is_valid = set true
    end
else
    if equals ${CARGO_MAKE_RUST_TARGET_OS} ${REQUIRED_HOST}
        host_is_valid = set true
    end
end

if equals ${host_is_valid} false
    echo "error: this task requires ${REQUIRED_HOST_DESCRIPTION}; current host is ${CARGO_MAKE_RUST_TARGET_OS}"
    exit 1
end
'''

[tasks._require-unix]
extend = "_require-host"
env = { "REQUIRED_HOST" = "unix", "REQUIRED_HOST_DESCRIPTION" = "a Unix host" }

[tasks._require-windows]
extend = "_require-host"
env = { "REQUIRED_HOST" = "windows", "REQUIRED_HOST_DESCRIPTION" = "Windows" }

[tasks._require-linux]
extend = "_require-host"
env = { "REQUIRED_HOST" = "linux", "REQUIRED_HOST_DESCRIPTION" = "Linux" }

# Native Unix

[tasks.unix-check]
description = "Check all native Unix targets and features"
dependencies = ["_require-unix"]
command = "cargo"
args = ["check", "--all-targets", "--all-features", "--locked"]

[tasks.unix-clippy]
description = "Run strict Clippy for all native Unix targets and features"
dependencies = ["_require-unix"]
command = "cargo"
args = [
  "clippy",
  "--all-targets",
  "--all-features",
  "--locked",
  "--",
  "-D",
  "warnings",
]

[tasks.unix-test]
description = "Run all native Unix tests"
dependencies = ["_require-unix"]
command = "cargo"
args = ["test", "--all-targets", "--all-features", "--locked"]

[tasks.unix-build]
description = "Build all native Unix targets and features"
dependencies = ["_require-unix"]
command = "cargo"
args = ["build", "--all-targets", "--all-features", "--locked"]

[tasks.unix-installer-test]
description = "Test the Unix installer with local release archives"
dependencies = ["_require-unix"]
command = "sh"
args = ["tests/installers/unix.sh"]

# Native Windows

[tasks.windows-check]
description = "Check all targets and features on a native Windows host"
dependencies = ["_require-windows"]
command = "cargo"
args = ["check", "--all-targets", "--all-features", "--locked"]

[tasks.windows-clippy]
description = "Run strict Clippy on a native Windows host"
dependencies = ["_require-windows"]
command = "cargo"
args = [
  "clippy",
  "--all-targets",
  "--all-features",
  "--locked",
  "--",
  "-D",
  "warnings",
]

[tasks.windows-test]
description = "Run all tests on a native Windows host"
dependencies = ["_require-windows"]
command = "cargo"
args = ["test", "--all-targets", "--all-features", "--locked"]

[tasks.windows-build]
description = "Build all targets and features on a native Windows host"
dependencies = ["_require-windows"]
command = "cargo"
args = ["build", "--all-targets", "--all-features", "--locked"]

[tasks.windows-installer-test]
description = "Test the Windows installer with a local release archive"
dependencies = ["_require-windows"]
command = "pwsh"
args = ["-NoProfile", "-File", "tests/installers/windows.ps1"]

# Linux-hosted Windows MSVC cross-verification

[tasks.xwin-check]
description = "Cross-check the Windows MSVC target from Linux"
dependencies = ["_require-linux"]
command = "cargo"
args = [
  "xwin",
  "check",
  "--target",
  "x86_64-pc-windows-msvc",
  "--all-targets",
  "--all-features",
  "--locked",
]

[tasks.xwin-clippy]
description = "Run strict Clippy for the Windows MSVC target from Linux"
dependencies = ["_require-linux"]
command = "cargo"
args = [
  "xwin",
  "clippy",
  "--target",
  "x86_64-pc-windows-msvc",
  "--all-targets",
  "--all-features",
  "--locked",
  "--",
  "-D",
  "warnings",
]

[tasks.xwin-build]
description = "Cross-build the Windows MSVC target from Linux"
dependencies = ["_require-linux"]
command = "cargo"
args = [
  "xwin",
  "build",
  "--target",
  "x86_64-pc-windows-msvc",
  "--all-targets",
  "--all-features",
  "--locked",
]

# Aggregate verification flows

[tasks.verify-common]
description = "Run platform-independent quality and release checks"
dependencies = [
  "format",
  "whitespace",
  "quality",
  "complexity",
  "doc",
  "msrv",
  "audit",
  "deny",
  "actions-lint",
  "zizmor",
  "_package-working-tree",
]

[tasks.verify-unix]
description = "Run complete native Unix verification"
dependencies = [
  "_require-unix",
  "verify-common",
  "installers-shellcheck",
  "unix-installer-test",
  "unix-check",
  "unix-clippy",
  "unix-test",
  "unix-build",
]

[tasks.verify-windows]
description = "Run complete verification on a native Windows host"
dependencies = [
  "_require-windows",
  "verify-common",
  "windows-installer-test",
  "windows-check",
  "windows-clippy",
  "windows-test",
  "windows-build",
]

[tasks.verify-xwin]
description = "Run all Linux-hosted Windows MSVC cross-target checks"
dependencies = ["_require-linux", "xwin-check", "xwin-clippy", "xwin-build"]

[tasks.verify]
description = "Run complete Linux and Windows cross-target verification"
dependencies = ["_require-linux", "verify-unix", "verify-xwin"]
