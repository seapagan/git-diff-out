[lint]
select = ["ALL"]
# Ruff's formatter owns trailing-comma layout.
ignore = ["COM812"]

[lint.per-file-ignores]
"scripts/check_complexity.py" = [
  "CPY001", # This repository does not add per-file copyright notices.
  "INP001", # The scripts directory contains executables, not a Python package.
  "T201",   # Printing the report and fatal diagnostics is this CLI's interface.
]
"tests/**/*.py" = [
  "INP001", # The tests directory contains test/support files, not a Python package.
]

[lint.pydocstyle]
convention = "google"
