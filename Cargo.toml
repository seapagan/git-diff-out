[package]
name = "git-diff-out"
version = "0.1.0"
edition = "2024"
rust-version = "1.85.0"
description = "Export common Git diffs to predictable diff files or stdout"
license = "MIT"
repository = "https://github.com/seapagan/git-diff-out"

[[bin]]
name = "gd"
path = "src/bin/gd.rs"

[[bin]]
name = "git-diff-out"
path = "src/bin/git-diff-out.rs"

[dependencies]
clap = { version = "4.6.6", features = ["derive"] }
colored_text = "0.5.1"
directories = "6.0.0"
serde = { version = "1.0.229", features = ["derive"] }
tempfile = "3.27.0"
toml = "1.1.6"
