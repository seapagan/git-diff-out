[package]
name = "git-diff-out"
version = "0.1.0"
edition = "2024"
description = "Export common Git diffs to predictable patch files or stdout"
license = "MIT"

[[bin]]
name = "gd"
path = "src/main.rs"

[dependencies]
clap = { version = "=4.6.6", features = ["derive"] }
colored_text = "0.5.1"
directories = "=6.0.0"
serde = { version = "=1.0.229", features = ["derive"] }
tempfile = "=3.27.0"
toml = "=1.1.6"

[dev-dependencies]
tempfile = "=3.27.0"
