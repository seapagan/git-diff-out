name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always
  RUST_VERSION: 1.98.1
  MSRV_VERSION: 1.85.0

jobs:
  msrv:
    name: Check MSRV
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust MSRV
        uses: seapagan/setup-rust@a91f5a34c552642ece0e8cef8b5e9226f41a3c0b # v1.0.0
        with:
          toolchain: ${{ env.MSRV_VERSION }}

      - name: Restore MSRV cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-${{ runner.os }}-rust-${{ env.MSRV_VERSION }}
          shared-key: msrv

      - name: Install Cargo Make
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-make@0.37.24

      - name: Check and test MSRV
        run: cargo make msrv

  linux:
    name: Native Linux
    runs-on: ubuntu-24.04

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: seapagan/setup-rust@a91f5a34c552642ece0e8cef8b5e9226f41a3c0b # v1.0.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: rustfmt clippy llvm-tools-preview

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-${{ runner.os }}-rust-${{ env.RUST_VERSION }}
          shared-key: native-linux

      - name: Install Cargo tools
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: >-
            cargo-make@0.37.24,
            cargo-nextest@0.9.144,
            cargo-llvm-cov@0.9.1

      - name: Install LCOV
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes lcov=2.0-4ubuntu2
          lcov --version

      - name: Check formatting
        run: cargo make format

      - name: Check native Linux targets
        run: cargo make unix-check

      - name: Lint native Linux targets
        run: cargo make unix-clippy

      - name: Check maintainability
        run: cargo make quality

      - name: Build Rust documentation
        run: cargo make doc

      - name: Run native Linux tests with coverage
        run: >-
          cargo llvm-cov nextest
          --all-targets
          --all-features
          --locked
          --no-fail-fast
          --remap-path-prefix
          --lcov
          --output-path=coverage-linux.lcov

      - name: Build native Linux targets
        run: cargo make unix-build

      - name: Validate Linux coverage
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage-linux.lcov
          awk '
            /^SF:/ {
              found = 1
              path = substr($0, 4)
              if (
                path == "" || path ~ /^\// || path ~ /^[A-Za-z]:[\\/]/ ||
                path ~ /(^|\/)\.\.(\/|$)/ || path ~ /\\/
              ) {
                print "Invalid LCOV source path: " $0 > "/dev/stderr"
                invalid = 1
              }
              if (seen[path]++) {
                print "Duplicate LCOV source path: " path > "/dev/stderr"
                duplicate = 1
              }
            }
            END { exit !found || invalid || duplicate }
          ' coverage-linux.lcov
          lcov --summary coverage-linux.lcov

      - name: Detect Linux coverage artifact
        id: linux-coverage
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [[ -s coverage-linux.lcov ]]; then
            echo "exists=true" >> "${GITHUB_OUTPUT:?}"
          else
            echo "exists=false" >> "${GITHUB_OUTPUT:?}"
          fi

      - name: Upload Linux coverage
        if: always() && steps.linux-coverage.outputs.exists == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-linux
          path: coverage-linux.lcov
          if-no-files-found: error
          retention-days: 1

  macos:
    name: Native macOS (${{ matrix.architecture }})
    runs-on: ${{ matrix.runner }}

    strategy:
      fail-fast: false
      matrix:
        include:
          - architecture: Apple Silicon
            runner: macos-15
            target: aarch64-apple-darwin
          - architecture: Intel
            runner: macos-15-intel
            target: x86_64-apple-darwin

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: seapagan/setup-rust@a91f5a34c552642ece0e8cef8b5e9226f41a3c0b # v1.0.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy

      - name: Verify native target
        shell: bash
        env:
          EXPECTED_TARGET: ${{ matrix.target }}
        run: |
          set -euo pipefail
          actual_target="$(rustc -vV | sed -n 's/^host: //p')"
          if [[ "$actual_target" != "$EXPECTED_TARGET" ]]; then
            echo "error: expected native host $EXPECTED_TARGET, got $actual_target" >&2
            exit 1
          fi

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-${{ runner.os }}-rust-${{ env.RUST_VERSION }}
          shared-key: native-macos-${{ matrix.target }}

      - name: Install Cargo tools
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: cargo-make@0.37.24,cargo-nextest@0.9.144

      - name: Check native macOS targets
        run: cargo make unix-check

      - name: Lint native macOS targets
        run: cargo make unix-clippy

      - name: Check maintainability
        run: cargo make quality

      - name: Build Rust documentation
        run: cargo make doc

      - name: Run native macOS tests
        run: >-
          cargo nextest run
          --all-targets
          --all-features
          --locked
          --no-fail-fast

      - name: Build native macOS targets
        run: cargo make unix-build

  windows:
    name: Native Windows
    runs-on: windows-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Install Rust toolchain
        uses: seapagan/setup-rust@a91f5a34c552642ece0e8cef8b5e9226f41a3c0b # v1.0.0
        with:
          toolchain: ${{ env.RUST_VERSION }}
          components: clippy llvm-tools-preview

      - name: Restore Rust cache
        uses: Swatinem/rust-cache@6323deb102c322ba6fcbdcafc7e3dddab59af2b6 # v2.9.2
        with:
          prefix-key: v1-${{ runner.os }}-rust-${{ env.RUST_VERSION }}
          shared-key: native-windows

      - name: Install Cargo tools
        uses: taiki-e/install-action@3f74d7c16a4242f1c95561e98edc25d36adb4375 # v2.87.12
        with:
          tool: >-
            cargo-make@0.37.24,
            cargo-nextest@0.9.144,
            cargo-llvm-cov@0.9.1

      - name: Check native Windows targets
        run: cargo make windows-check

      - name: Lint native Windows targets
        run: cargo make windows-clippy

      - name: Check maintainability
        run: cargo make quality

      - name: Build Rust documentation
        run: cargo make doc

      - name: Run native Windows tests with coverage
        run: >-
          cargo llvm-cov nextest
          --all-targets
          --all-features
          --locked
          --no-fail-fast
          --remap-path-prefix
          --lcov
          --output-path=coverage-windows.lcov

      - name: Build native Windows targets
        run: cargo make windows-build

      - name: Normalize Windows coverage paths
        shell: pwsh
        run: |
          $coveragePath = (Resolve-Path coverage-windows.lcov).Path
          $coverageLines = [System.IO.File]::ReadAllLines($coveragePath)
          for ($index = 0; $index -lt $coverageLines.Length; $index++) {
            if ($coverageLines[$index].StartsWith('SF:')) {
              $coverageLines[$index] = $coverageLines[$index].Replace('\', '/')
            }
          }
          $coverageText = [string]::Join("`n", $coverageLines) + "`n"
          [System.IO.File]::WriteAllText(
            $coveragePath,
            $coverageText,
            [System.Text.UTF8Encoding]::new($false)
          )

      - name: Validate Windows coverage
        shell: pwsh
        run: |
          $coveragePath = (Resolve-Path coverage-windows.lcov).Path
          if ((Get-Item $coveragePath).Length -eq 0) {
            throw "The Windows coverage report is empty."
          }
          $sourcePaths = @(
            Select-String -Path $coveragePath -Pattern '^SF:' |
              ForEach-Object { $_.Line.Substring(3) }
          )
          if ($sourcePaths.Count -eq 0) {
            throw "The Windows coverage report contains no source paths."
          }
          $invalidPaths = @(
            $sourcePaths | Where-Object {
              [System.IO.Path]::IsPathRooted($_) -or
              $_.Contains('\') -or
              ($_.Split('/') -contains '..')
            }
          )
          if ($invalidPaths.Count -gt 0) {
            $invalidPaths | ForEach-Object {
              Write-Error "Invalid LCOV source path: $_"
            }
            throw "The Windows coverage report has invalid source paths."
          }
          $duplicatePaths = @(
            $sourcePaths |
              Group-Object |
              Where-Object { $_.Count -gt 1 } |
              ForEach-Object { $_.Name }
          )
          if ($duplicatePaths.Count -gt 0) {
            $duplicatePaths | ForEach-Object {
              Write-Error "Duplicate LCOV source path: $_"
            }
            throw "The Windows coverage report has duplicate source paths."
          }

      - name: Detect Windows coverage artifact
        id: windows-coverage
        if: always()
        shell: pwsh
        run: |
          if (
            (Test-Path coverage-windows.lcov) -and
            (Get-Item coverage-windows.lcov).Length -gt 0
          ) {
            "exists=true" >> $env:GITHUB_OUTPUT
          } else {
            "exists=false" >> $env:GITHUB_OUTPUT
          }

      - name: Upload Windows coverage
        if: always() && steps.windows-coverage.outputs.exists == 'true'
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-windows
          path: coverage-windows.lcov
          if-no-files-found: error
          retention-days: 1

  coverage:
    name: Combined coverage
    runs-on: ubuntu-24.04
    needs: [linux, windows]

    steps:
      - name: Checkout tested commit
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.sha }}
          persist-credentials: false

      - name: Download Linux coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-linux
          path: coverage/linux

      - name: Download Windows coverage
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: coverage-windows
          path: coverage/windows

      - name: Install LCOV
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install --yes lcov=2.0-4ubuntu2
          lcov --version

      - name: Validate native coverage inputs
        shell: bash
        run: |
          set -euo pipefail
          for report in \
            coverage/linux/coverage-linux.lcov \
            coverage/windows/coverage-windows.lcov
          do
            test -s "$report"
            awk '
              /^SF:/ {
                found = 1
                path = substr($0, 4)
                if (
                  path == "" || path ~ /^\// || path ~ /^[A-Za-z]:[\\/]/ ||
                  path ~ /(^|\/)\.\.(\/|$)/ || path ~ /\\/
                ) {
                  print "Invalid LCOV source path: " $0 > "/dev/stderr"
                  invalid = 1
                }
                if (seen[path]++) {
                  print "Duplicate LCOV source path: " path > "/dev/stderr"
                  duplicate = 1
                }
              }
              END { exit !found || invalid || duplicate }
            ' "$report"
          done

      - name: Merge native coverage
        shell: bash
        run: |
          set -euo pipefail
          lcov \
            --add-tracefile coverage/linux/coverage-linux.lcov \
            --add-tracefile coverage/windows/coverage-windows.lcov \
            --output-file coverage.lcov

      - name: Validate combined coverage
        shell: bash
        run: |
          set -euo pipefail
          test -s coverage.lcov
          awk '
            /^SF:/ {
              found = 1
              path = substr($0, 4)
              if (
                path == "" || path ~ /^\// || path ~ /^[A-Za-z]:[\\/]/ ||
                path ~ /(^|\/)\.\.(\/|$)/ || path ~ /\\/
              ) {
                print "Invalid LCOV source path: " $0 > "/dev/stderr"
                invalid = 1
              }
              if (seen[path]++) {
                print "Duplicate LCOV source path: " path > "/dev/stderr"
                duplicate = 1
              }
            }
            END { exit !found || invalid || duplicate }
          ' coverage.lcov
          lcov --summary coverage.lcov

      - name: Upload combined coverage
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: coverage-combined
          path: coverage.lcov
          if-no-files-found: error
          retention-days: 1
